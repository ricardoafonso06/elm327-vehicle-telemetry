[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vehicle-telemetry"
version = "0.1.0"
description = "Read-only vehicle telemetry over ELM327, with a simulator and a security-oriented analysis layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5", "pyyaml>=6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = [
  "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10",
  "bandit>=1.7", "pip-audit>=2.7", "types-PyYAML", "types-pyserial",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_telemetry"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
